name: puntti-urpo-production
services:
  db:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_DB: punttiurpo
      POSTGRES_USER: punttiurpo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [private]
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=30]
    mem_limit: 384m
    cpus: 1
    shm_size: 64m
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  backend:
    image: puntti-urpo-backend:${RELEASE:?required}
    build: {context: .., dockerfile: deploy/backend.Dockerfile}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: punttiurpo
      POSTGRES_USER: punttiurpo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      OWNER_PASSWORD_HASH: ${OWNER_PASSWORD_HASH:?required}
      DEMO_PASSWORD_HASH: ${DEMO_PASSWORD_HASH:?required}
      SESSION_COOKIE_SECURE: 'true'
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_TOMCAT_THREADS_MAX: 32
      SERVER_TOMCAT_THREADS_MIN_SPARE: 4
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      SPRINGDOC_API_DOCS_ENABLED: 'false'
      SPRINGDOC_SWAGGER_UI_ENABLED: 'false'
      LOGGING_LEVEL_ROOT: INFO
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50 -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=64m -Xss512k -XX:ActiveProcessorCount=2
    networks: [private]
    depends_on: {db: {condition: service_healthy}}
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,noexec,size=64m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, java, -Xmx16m, -cp, /health, HealthCheck]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  web:
    image: puntti-urpo-web:${WEB_RELEASE:-${RELEASE:?required}}
    build: {context: .., dockerfile: deploy/frontend.Dockerfile}
    ports: ['127.0.0.1:${WEB_PORT:-8106}:8080']
    networks: [private, edge]
    depends_on: {backend: {condition: service_healthy}}
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,noexec,size=16m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
networks:
  private: {internal: true}
  edge: {}
volumes:
  postgres_data: {}
